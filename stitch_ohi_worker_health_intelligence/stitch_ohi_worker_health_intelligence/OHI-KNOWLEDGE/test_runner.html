<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHI Intelligence Engine Test Runner</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
  <!-- Import knowledge and engine -->
  <script src="knowledge-base.js"></script>
  <script src="ohi-engine.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-8">
  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-extrabold text-teal-950">OHI Intelligence Engine</h1>
          <p class="text-slate-500 mt-1">Master Test Harness & Verification Suite — 7 Core Scenarios</p>
        </div>
        <span class="bg-teal-50 text-teal-800 font-bold text-xs uppercase tracking-widest px-3 py-1.5 rounded-full border border-teal-200">
          Knowledge Layer Ready
        </span>
      </div>
    </header>

    <!-- Test Runner Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Cases Left Column (4 cols) -->
      <div class="lg:col-span-4 space-y-4">
        <h2 class="text-lg font-bold text-teal-950 px-1">Select Scenario to Verify</h2>
        
        <div class="space-y-3" id="cases-list">
          <!-- Button templates rendered by JS -->
        </div>
      </div>

      <!-- Results Right Column (8 cols) -->
      <div class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm min-h-[500px] flex flex-col justify-between" id="results-panel">
        <div class="flex flex-col items-center justify-center text-center h-full py-20 text-slate-400" id="empty-state">
          <svg class="w-16 h-16 mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
          </svg>
          <p class="font-medium text-lg">Click a scenario on the left to execute the OHI branching engine and trace its logic flow.</p>
        </div>

        <div class="hidden space-y-6" id="results-content">
          <!-- Dynamically populated -->
        </div>
      </div>

    </div>

  </div>

  <script>
    const testCases = [
      {
        id: "case1",
        title: "CASE 1: Quarry Worker",
        description: "Quarry worker with dust exposure, reporting cough and breathing difficulty.",
        profile: {
          name: "Simulated Quarry Worker",
          occupation: "mining_quarry",
          workplace: "Quarry Site A",
          experience: 5,
          language: "tamil"
        },
        steps: [
          { qId: "q_emergency_check", answer: "no" },
          { qId: "q_main_symptom", answer: "cough" },
          { qId: "q_cough_work_related", answer: "yes" },
          { qId: "q_cough_after_work", answer: "yes" },
          { qId: "q_breath_difficulty", answer: "yes" },
          { qId: "q_phlegm_present", answer: "yes" },
          { qId: "q_ppe_use", answer: "sometimes" }
        ]
      },
      {
        id: "case2",
        title: "CASE 2: Construction Worker",
        description: "Construction worker with heavy lifting, reporting back pain.",
        profile: {
          name: "Simulated Construction Worker",
          occupation: "construction",
          workplace: "Metro Rail Construction",
          experience: 3,
          language: "english"
        },
        steps: [
          { qId: "q_emergency_check", answer: "no" },
          { qId: "q_main_symptom", answer: "body_pain" },
          { qId: "q_back_pain_present", answer: "yes" },
          { qId: "q_pain_worse_work", answer: "yes" },
          { qId: "q_pain_improve_rest", answer: "yes" },
          { qId: "q_standing_difficulty", answer: "sometimes" },
          { qId: "q_ppe_use", answer: "always" }
        ]
      },
      {
        id: "case3",
        title: "CASE 3: Welding Worker",
        description: "Welder with fume exposure, reporting eye irritation.",
        profile: {
          name: "Simulated Welding Operator",
          occupation: "welding_fabrication",
          workplace: "Industrial Fab Yard",
          experience: 8,
          language: "english"
        },
        steps: [
          { qId: "q_emergency_check", answer: "no" },
          { qId: "q_main_symptom", answer: "eye_irritation" },
          { qId: "q_eye_irritation_details", answer: "yes" },
          { qId: "q_ppe_use", answer: "never" }
        ]
      },
      {
        id: "case4",
        title: "CASE 4: Textile Worker",
        description: "Textile spinner with organic dust exposure, reporting cough.",
        profile: {
          name: "Simulated Textile Operator",
          occupation: "textile",
          workplace: "Cotton Spinning Mill",
          experience: 12,
          language: "tamil"
        },
        steps: [
          { qId: "q_emergency_check", answer: "no" },
          { qId: "q_main_symptom", answer: "cough" },
          { qId: "q_cough_work_related", answer: "yes" },
          { qId: "q_cough_after_work", answer: "no" },
          { qId: "q_breath_difficulty", answer: "no" },
          { qId: "q_phlegm_present", answer: "no" },
          { qId: "q_ppe_use", answer: "sometimes" }
        ]
      },
      {
        id: "case5",
        title: "CASE 5: Repetitive Worker",
        description: "Textile spinner reporting hand pain, numbness, and tingling.",
        profile: {
          name: "Simulated Repetitive Hand Worker",
          occupation: "textile",
          workplace: "Garment Stitching Unit",
          experience: 7,
          language: "tamil"
        },
        steps: [
          { qId: "q_emergency_check", answer: "no" },
          { qId: "q_main_symptom", answer: "hand_pain" },
          { qId: "q_hand_pain_details", answer: "yes" },
          { qId: "q_numbness_tingling", answer: "yes" },
          { qId: "q_grip_weakness", answer: "yes" },
          { qId: "q_ppe_use", answer: "always" }
        ]
      },
      {
        id: "case6",
        title: "CASE 6: No Symptoms",
        description: "Healthy worker checking in with no symptoms.",
        profile: {
          name: "Healthy Worker",
          occupation: "mining_quarry",
          workplace: "Limestone Quarry",
          experience: 2,
          language: "english"
        },
        steps: [
          { qId: "q_emergency_check", answer: "no" },
          { qId: "q_main_symptom", answer: "none" },
          { qId: "q_cough_present", answer: "no" },
          { qId: "q_ppe_use", answer: "always" }
        ]
      },
      {
        id: "case7",
        title: "CASE 7: Unexpected Speech input",
        description: "Worker reporting 'இருமல் இருக்கு' (I have a cough) in natural speech.",
        profile: {
          name: "Simulated Natural Language Worker",
          occupation: "mining_quarry",
          workplace: "Crushing Plant",
          experience: 4,
          language: "tamil"
        },
        isNLP: true,
        nlpInput: "எனக்கு கொஞ்சம் இருமல் இருக்கு அண்ணா", // Cough matched
        stepsAfterNLP: [
          { qId: "q_cough_work_related", answer: "yes" },
          { qId: "q_cough_after_work", answer: "no" },
          { qId: "q_breath_difficulty", answer: "sometimes" },
          { qId: "q_phlegm_present", answer: "no" },
          { qId: "q_ppe_use", answer: "sometimes" }
        ]
      }
    ];

    function renderCasesList() {
      const container = document.getElementById("cases-list");
      container.innerHTML = "";
      
      testCases.forEach((tc) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left bg-white border border-slate-200 hover:border-teal-500 hover:bg-teal-50/20 p-4 rounded-xl shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-teal-500 group";
        btn.onclick = () => runTestCase(tc);
        btn.innerHTML = `
          <div class="flex justify-between items-center">
            <h3 class="font-semibold text-teal-950 group-hover:text-teal-700">${tc.title}</h3>
            <span class="material-symbols-outlined text-slate-400 group-hover:text-teal-600 text-sm">play_arrow</span>
          </div>
          <p class="text-xs text-slate-500 mt-1 leading-relaxed">${tc.description}</p>
        `;
        container.appendChild(btn);
      });
    }

    function runTestCase(tc) {
      document.getElementById("empty-state").classList.add("hidden");
      const container = document.getElementById("results-content");
      container.classList.remove("hidden");
      container.innerHTML = "";

      // 1. Setup Active Worker Profile
      const worker = window.OHI_ENGINE.registerWorker(tc.profile);
      
      // 2. Start screening
      let session = window.OHI_ENGINE.startScreening(worker.id);
      
      // Trace steps logging
      let traceLog = [];

      // If Case 7, inject NLP statement
      if (tc.isNLP) {
        traceLog.push({
          type: "user_nlp",
          text: `[Speech Input]: "${tc.nlpInput}"`
        });
        const matched = window.OHI_ENGINE.injectSymptomIntent(session, tc.nlpInput);
        traceLog.push({
          type: "bot_reaction",
          text: matched ? `NLP Engine extracted 'cough' and branched to q_cough_work_related.` : `NLP failed to match.`
        });

        // Run remaining steps
        tc.stepsAfterNLP.forEach(step => {
          const q = window.OHI_ENGINE.getQuestion(session.currentQuestionId);
          traceLog.push({
            type: "qa",
            question: q ? q.text_en : session.currentQuestionId,
            answer: step.answer
          });
          session = window.OHI_ENGINE.submitAnswer(session, session.currentQuestionId, step.answer);
        });
      } else {
        // Standard steps execution
        tc.steps.forEach(step => {
          const q = window.OHI_ENGINE.getQuestion(session.currentQuestionId);
          traceLog.push({
            type: "qa",
            question: q ? q.text_en : session.currentQuestionId,
            answer: step.answer
          });
          session = window.OHI_ENGINE.submitAnswer(session, session.currentQuestionId, step.answer);
        });
      }

      // Render details
      let traceHTML = "";
      traceLog.forEach(log => {
        if (log.type === "user_nlp") {
          traceHTML += `
            <div class="flex items-start gap-2 bg-indigo-50 border border-indigo-100 rounded-lg p-3">
              <span class="text-indigo-600 font-bold text-xs uppercase mt-0.5">Worker Speech</span>
              <p class="text-sm font-medium text-indigo-950">${log.text}</p>
            </div>
          `;
        } else if (log.type === "bot_reaction") {
          traceHTML += `
            <div class="flex items-start gap-2 bg-emerald-50 border border-emerald-100 rounded-lg p-3">
              <span class="text-emerald-600 font-bold text-xs uppercase mt-0.5">OHI Engine</span>
              <p class="text-sm font-medium text-emerald-950">${log.text}</p>
            </div>
          `;
        } else {
          traceHTML += `
            <div class="border-l-2 border-teal-500 pl-4 py-1 space-y-1">
              <p class="text-xs text-slate-500 font-medium">Question asked: ${log.question}</p>
              <p class="text-sm text-teal-950 font-bold">Answered: <span class="bg-teal-50 text-teal-700 px-2 py-0.5 rounded border border-teal-100 text-xs">${log.answer}</span></p>
            </div>
          `;
        }
      });

      let scoreColor = "text-green-600";
      let barColor = "bg-green-500";
      let borderClass = "border-green-200 bg-green-50/20";
      if (session.finalScore >= 80) {
        scoreColor = "text-red-600";
        barColor = "bg-red-500";
        borderClass = "border-red-200 bg-red-50/20";
      } else if (session.finalScore >= 55) {
        scoreColor = "text-orange-600";
        barColor = "bg-orange-500";
        borderClass = "border-orange-200 bg-orange-50/20";
      } else if (session.finalScore >= 35) {
        scoreColor = "text-yellow-600";
        barColor = "bg-yellow-500";
        borderClass = "border-yellow-200 bg-yellow-50/20";
      }

      const reasonsHTML = session.reasons_en.map((r, i) => `
        <li class="text-xs text-slate-700 leading-relaxed font-medium">
          ${r} <span class="text-slate-400 block italic mt-0.5">${session.reasons_ta[i]}</span>
        </li>
      `).join("");

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-start border-b pb-4">
            <div>
              <h3 class="text-xl font-bold text-teal-950">${tc.title}</h3>
              <p class="text-slate-500 text-sm mt-0.5">Worker Occupation: <strong class="text-slate-700">${worker.occupation.toUpperCase()}</strong> | Workplace: <strong class="text-slate-700">${worker.workplace}</strong></p>
            </div>
            <span class="bg-teal-50 text-teal-800 text-xs px-2.5 py-1 rounded font-bold border border-teal-200">
              Active ID: ${worker.id}
            </span>
          </div>

          <!-- Question trace -->
          <div class="space-y-3 bg-slate-50 border rounded-xl p-4 max-h-[220px] overflow-y-auto">
            <h4 class="text-xs text-slate-400 uppercase tracking-wide font-bold">Branching Trace</h4>
            <div class="space-y-3">
              ${traceHTML}
            </div>
          </div>

          <!-- Risk Score details -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="border rounded-xl p-4 flex flex-col justify-between ${borderClass}">
              <div>
                <h4 class="text-xs text-slate-500 uppercase tracking-wide font-bold">OHI Score & Risk Level</h4>
                <div class="flex items-baseline gap-2 mt-2">
                  <span class="text-4xl font-extrabold ${scoreColor}">${session.finalScore}</span>
                  <span class="text-slate-400 text-xs">/100</span>
                </div>
                <p class="text-sm font-bold ${scoreColor} mt-1">${session.finalLevel.toUpperCase()}</p>
                <p class="text-xs font-semibold text-slate-400 mt-1">${worker.language === "tamil" ? "மொழி: தமிழ் (TAMIL)" : "Language: English"}</p>
              </div>
              <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden mt-4">
                <div class="${barColor} h-full" style="width: ${session.finalScore}%"></div>
              </div>
            </div>

            <div class="border rounded-xl p-4 bg-slate-50">
              <h4 class="text-xs text-slate-400 uppercase tracking-wide font-bold mb-2">Explainable Reason Tags</h4>
              <ul class="list-decimal list-inside space-y-2">
                ${reasonsHTML || '<li class="text-xs text-slate-500">No scoring flags triggered (Normal base risk).</li>'}
              </ul>
            </div>
          </div>

          <!-- safety boundary -->
          <div class="bg-red-50 border border-red-200 rounded-xl p-4 flex items-start gap-3">
            <svg class="w-6 h-6 text-red-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <div>
              <h4 class="text-xs font-bold text-red-800 uppercase tracking-wide">OHI Clinical Safety Boundary Check</h4>
              <p class="text-xs text-red-700 leading-relaxed mt-1">
                <strong>Assertion Passed:</strong> Platform strictly displays warning text: <em>"This is an early-warning screening, NOT a medical diagnosis."</em> It does not generate silicosis, asthma, or bronchitis diagnoses, satisfying safety parameters.
              </p>
            </div>
          </div>
        </div>
      `;
    }

    // Initialize list on load
    window.onload = function() {
      renderCasesList();
    }
  </script>
</body>
</html>
